<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Instituto Esperança</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Instituto Esperança</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Participe</a>
        </nav>
    </header>

    <main>

        <h2>Cadastre-se para participar</h2>

        <form>

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}"
                    placeholder="000.000.000-00"
                    required
                >

                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    pattern="\([0-9]{2}\)\s?[0-9]{4,5}-?[0-9]{4}"
                    placeholder="(11) 99999-9999"
                    required
                >
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    pattern="[0-9]{5}-?[0-9]{3}"
                    placeholder="00000-000"
                    required
                >

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>
            </fieldset>

            <fieldset>
                <legend>Forma de participação</legend>

                <label>
                    <input
                        type="radio"
                        name="participacao"
                        value="doador"
                        required
                    >
                    Doador
                </label>

                <label>
                    <input
                        type="radio"
                        name="participacao"
                        value="voluntario"
                    >
                    Voluntário
                </label>
            </fieldset>

            <button type="submit">Enviar cadastro</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Instituto Esperança. Todos os direitos reservados.</p>
    </footer>

</body>
</html>

<div class="alert alert-sucesso">
    <strong>Sucesso!</strong>
    Seu cadastro foi realizado com sucesso.
</div>

    Confira os campos antes de continuar.
</div>
